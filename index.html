<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/intro.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/hero.css">

    <title>Vestinger</title>
</head>

<body id="top">
    <main>
        <section class="intro" aria-label="Introducao Vestinger">
            <div class="intro__meta intro__meta--top-left" aria-hidden="true">
                <span>VESTINGER®</span>
                <span>WEB DESIGN</span>
            </div>

            <div class="intro__meta intro__meta--top-right" aria-hidden="true">
                <span>EST. 2026</span>
                <span>BRAZIL</span>
            </div>

            <div class="intro__meta intro__meta--bottom-left" aria-hidden="true">
                <span>SELECTED DIGITAL EXPERIENCES</span>
            </div>

            <div class="intro__meta intro__meta--bottom-right" aria-hidden="true">
                <span>DIGITAL PRESENCE</span>
            </div>

            <div class="intro__mark" aria-label="Vestinger">
                <span class="intro__letter intro__letter--v" aria-hidden="true">V</span>
                <span class="intro__letter intro__letter--e-left" aria-hidden="true">E</span>
                <span class="intro__letter intro__letter--s" aria-hidden="true">S</span>
                <span class="intro__letter intro__letter--t" aria-hidden="true">T</span>
                <img class="intro__sword" src="assets/logos/vestinger-sword.svg" alt="" aria-hidden="true">
                <span class="intro__letter intro__letter--n" aria-hidden="true">N</span>
                <span class="intro__letter intro__letter--g" aria-hidden="true">G</span>
                <span class="intro__letter intro__letter--e-right" aria-hidden="true">E</span>
                <span class="intro__letter intro__letter--r" aria-hidden="true">R</span>
            </div>
        </section>

        <section class="hero" aria-label="Vestinger Web Design">
            <header class="site-header">
                <a class="site-header__brand" href="#top" aria-label="Vestinger, voltar ao inicio">
                    <span>VEST</span>
                    <img
                        class="site-header__brand-sword"
                        src="assets/logos/vestinger-sword.svg"
                        alt=""
                        aria-hidden="true"
                    >
                    <span>NGER</span>
                </a>

                <nav class="site-header__nav" aria-label="Navegacao principal">
                    <a href="#work">WORK</a>
                    <a href="#what-we-do">WHAT WE DO</a>
                </nav>

                <a class="site-header__cta" href="contact.html">CONTACT US</a>
            </header>

            <div class="hero__content">
                <h1 class="hero__title">
                    <span>MAIS DO QUE UM SITE.</span>
                    <span>UMA PRESENÇA.</span>
                </h1>
            </div>

            <div class="hero__cta-wrap">
                <a class="hero__cta" href="contact.html">
                    TRANSFORME SUA PRESENÇA DIGITAL
                </a>
            </div>

            <img
                class="hero__landscape"
                src="assets/images/paisagem-hero-vestinger.png"
                alt="Notebook diante de uma paisagem costeira ao entardecer"
            >
        </section>
    </main>

    <script src="js/main.js" type="module"></script>
</body>
</html>
